name: Tooling

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile benchmarks/histogram/*.py
      - run: bash -n scripts/*.sh benchmarks/histogram/*.sh
      - run: python benchmarks/histogram/histogram_algo_sweep.py --help
      - run: python benchmarks/histogram/histogram_algo_perf.py --help
